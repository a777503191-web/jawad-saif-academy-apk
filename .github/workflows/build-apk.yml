name: Build Jawad & Saif Academy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unpack raw.zip into public/assets
        run: |
          mkdir -p src public/assets
          if [ -f raw.zip ]; then
            python3 - << 'PYEOF'
import zipfile, os
try:
    with zipfile.ZipFile('raw.zip', 'r') as zf:
        for info in zf.infolist():
            if info.is_dir():
                continue
            name = info.filename
            if name.startswith('raw/'):
                name = name[4:]
            base = os.path.basename(name)
            if not base:
                continue
            out_path = os.path.join('public/assets', base)
            with open(out_path, 'wb') as f:
                f.write(zf.read(info.filename))
    print('Unpacked assets count:', len(os.listdir('public/assets')))
except Exception as e:
    print('raw.zip extract error:', e)
PYEOF
          fi

      - name: Install dependencies and build web bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p dist/assets
          cp -rn public/assets/* dist/assets/ 2>/dev/null || true

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          python3 - << 'PYEOF'
import os
p = 'android/app/src/main/AndroidManifest.xml'
if os.path.exists(p):
    s = open(p, encoding='utf-8').read()
    perm = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
    if perm not in s:
        s = s.replace('<application', perm + '
    <application', 1)
    open(p, 'w', encoding='utf-8').write(s)
PYEOF

      - name: Assemble Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jawad-Saif-Academy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
