name: Build Jawad & Saif Academy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Unpack raw.zip into public/assets
        run: |
          mkdir -p src public/assets
          if [ -f raw.zip ]; then
            python3 -c "import zipfile, os; z=zipfile.ZipFile('raw.zip'); [open(os.path.join('public/assets', os.path.basename(i.filename[4:] if i.filename.startswith('raw/') else i.filename)), 'wb').write(z.read(i.filename)) for i in z.infolist() if not i.is_dir() and os.path.basename(i.filename[4:] if i.filename.startswith('raw/') else i.filename)]" || true
          fi
          ls -la public/assets || true

      - name: Install dependencies and build web bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p dist/assets
          cp -r public/assets/* dist/assets/ 2>/dev/null || true

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          python3 -c "import os; p='android/app/src/main/AndroidManifest.xml'; s=open(p,encoding='utf-8').read(); perm='<uses-permission android:name="android.permission.RECORD_AUDIO" />'; open(p,'w',encoding='utf-8').write(s.replace('<application', perm+'
    <application', 1) if os.path.exists(p) and perm not in s else s)"

      - name: Assemble Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jawad-Saif-Academy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
